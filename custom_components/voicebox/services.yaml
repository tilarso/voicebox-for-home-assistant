synthesize:
  name: Synthesize speech
  description: Send text to Voicebox for speech synthesis.
  fields:
    text:
      name: Text
      description: Text content to synthesize.
      required: true
      selector:
        text:
    voice:
      name: Voice
      description: Optional voice identifier to use for synthesis.
      required: false
      selector:
        text:
    output_path:
      name: Output path
      description: Optional file path where Voicebox should write audio output. Must remain under /config/media/voicebox.
      required: false
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional Voicebox config entry id. Required when multiple Voicebox instances are configured.
      required: false
      selector:
        text:
